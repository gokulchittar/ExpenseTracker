<html lang="en">
<head>

<title>Money Tracker</title>
<style>

label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}

.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;min-height:32px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}

.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{flex:1}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 0}

</head>
